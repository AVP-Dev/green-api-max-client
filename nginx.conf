server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 3000 default_server;
    listen [::]:3000 default_server;
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # NOTE: TLS должен терминироваться выше (Coolify / reverse-proxy с редиректом
    # http -> https). Сам контейнер отдаёт http внутри доверенной сети, а HSTS
    # ниже запрещает браузеру в дальнейшем ходить по http к этому хосту.
    # Не выставляйте контейнер напрямую в интернет без https-редиректа на edge.

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Hide nginx version (allowed in http/server/location contexts)
    server_tokens off;

    # Security headers (server-level).
    # NOTE: nginx does NOT inherit add_header directives into a location block
    # that defines its own add_header, so every location with add_header below
    # must repeat the full security set.
    #
    # EMBED vs CLICKJACKING: frame-ancestors 'self' + SAMEORIGIN ЗАПРЕЩАЮТ
    # кросс-доменный iframe-embed в CRM (Bitrix24/amoCRM). Это осознанный дефолт.
    # Для разрешения встраивания замените обе директивы на allowlist CRM, например:
    #   add_header X-Frame-Options "ALLOW-FROM https://crm.example.com" always;  # legacy, игнорируется Chrome
    #   frame-ancestors 'self' https://crm.example.com https://portal.example.com
    # и соберите отдельный nginx.conf для embed-деплоя. Не ставьте '*' / ALLOWALL.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.green-api.com https://*.greenapi.com https:; connect-src 'self' https://*.green-api.com https://*.greenapi.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-write=(self)" always;

    # PWA service worker & workbox runtime: NEVER cache (Vite PWA docs).
    # Должны идти ДО generic-ассетов ниже, иначе sw.js закэшируется на год (immutable)
    # и пользователи зависнут на старом бандле.
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.green-api.com https://*.greenapi.com https:; connect-src 'self' https://*.green-api.com https://*.greenapi.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    location ~* ^/workbox-.*\.js$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.green-api.com https://*.greenapi.com https:; connect-src 'self' https://*.green-api.com https://*.greenapi.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        access_log off;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.green-api.com https://*.greenapi.com https:; connect-src 'self' https://*.green-api.com https://*.greenapi.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    # registerSW.js не имеет хеша в имени — тоже не кэшируем агрессивно,
    # иначе регистрация SW может залипнуть на старой версии.
    location = /registerSW.js {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Static assets with cache busting hashes: Cache for 1 year
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Repeat security headers: location-level add_header resets inheritance
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.green-api.com https://*.greenapi.com https:; connect-src 'self' https://*.green-api.com https://*.greenapi.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-write=(self)" always;
        access_log off;
        try_files $uri =404;
    }

    # SPA routing: Forward all non-asset requests to index.html
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so users receive app updates immediately
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        # Repeat security headers: location-level add_header resets inheritance
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.green-api.com https://*.greenapi.com https:; connect-src 'self' https://*.green-api.com https://*.greenapi.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-write=(self)" always;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        # Repeat security headers: location without add_header inherits server
        # headers automatically, but keep explicit for auditability
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.green-api.com https://*.greenapi.com https:; connect-src 'self' https://*.green-api.com https://*.greenapi.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), clipboard-write=(self)" always;
    }
}
