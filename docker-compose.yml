services:
  messenger:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-time Vite env (вшиваются в JS-бандл при сборке).
        # Скопируйте .env.example в .env или задайте переменные в окружении/Coolify.
        - VITE_TRUSTED_PARENT_ORIGINS=${VITE_TRUSTED_PARENT_ORIGINS:-}
        - VITE_DEFAULT_API_URL=${VITE_DEFAULT_API_URL:-https://3100.api.green-api.com}
    container_name: max-web-messenger
    restart: unless-stopped
    ports:
      # Host 3000 -> container 80 (канонический entrypoint).
      # nginx внутри по-прежнему слушает 80/3000/8080 для Coolify-совместимости.
      - "3000:80"
    environment:
      - NODE_ENV=production
